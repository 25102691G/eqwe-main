[program:celery_queue]
; Queue worker for face and tongue analysis tasks.
command=conda run -n tongue celery -A api.queue.celery_app.celery_app worker --pool=solo --loglevel INFO -Q face_analysis,tongue_analysis

directory=D:\aproject\shemian\skin_alporithm

; 运行用户 (Windows下可以注释掉)
; user=your_username

; 自动启动设置为false，如果需要celery再改为true
autostart=false
autorestart=true

; 日志重定向
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/celery_queue.log

; 环境变量
environment=PYTHONPATH="D:\aproject\shemian\skin_alporithm;D:\aproject\shemian"
