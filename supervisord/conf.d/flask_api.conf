[program:flask_app]
; 使用conda环境中的gunicorn
; 请将 /path/to/anaconda3 替换为你的实际conda安装路径
; 例如: C:\Users\YourName\anaconda3 或 /home/user/anaconda3
command=E:\anaconda3\envs\skin\Scripts\gunicorn.exe --bind "0.0.0.0:5000" --workers 4 --worker-class sync --threads 2 --timeout 300 --preload app:app

; 项目目录 - 请替换为实际路径
directory=E:\aproject\skin_alporithm

; 运行用户 (Windows下可以注释掉)
; user=your_username

; 自动启动和重启
autostart=true
autorestart=true

; 日志重定向
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/flask_app.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10

; 环境变量
environment=FLASK_APP="app.py",FLASK_ENV="production",PYTHONPATH="E:\aproject\skin_alporithm"

; 进程优先级
priority=999

; 停止信号
stopsignal=TERM
stopwaitsecs=10



