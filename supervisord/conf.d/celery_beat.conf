[program:celery_beat]
; Optional scheduler. Current analysis queues do not require periodic jobs.
command=conda run -n tongue celery -A api.queue.celery_app.celery_app beat --loglevel=INFO

directory=D:\aproject\shemian\skin_alporithm

; 运行用户 (Windows下可以注释掉)
; user=your_username

; 自动启动设置为false，如果需要celery再改为true
autostart=false
autorestart=true

; 日志重定向
redirect_stderr=true
stdout_logfile=%(here)s/../../logs/celery_beat.log

; 环境变量
environment=PYTHONPATH="D:\aproject\shemian\skin_alporithm;D:\aproject\shemian"
