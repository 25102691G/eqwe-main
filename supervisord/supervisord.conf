; Supervisord 主配置文件
; 用于管理皮肤算法服务

; 使用inet HTTP server（Windows兼容）
[inet_http_server]
port=127.0.0.1:9001          ; 监听端口
username=admin               ; 用户名（可选）
password=123456              ; 密码（可选）

[supervisord]
logfile=%(here)s/../logs/supervisord.log        ; 主日志文件
logfile_maxbytes=50MB                                           ; 日志文件最大大小
logfile_backups=10                                              ; 日志文件备份数
loglevel=info                                                   ; 日志级别
pidfile=%(here)s/supervisord.pid ; pid文件
nodaemon=false                                                  ; 后台运行
minfds=1024                                                     ; 最小文件描述符
minprocs=200                                                    ; 最小进程数

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=http://127.0.0.1:9001  ; 连接到inet server
username=admin                    ; 用户名（与上面一致）
password=123456                   ; 密码（与上面一致）

; 包含子配置文件
[include]
files = %(here)s/conf.d/*.conf
